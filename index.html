<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>JARVIS AI - SRM Tools</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
  transition:.3s;
}

body.dark{
  background:#101522;
  color:#fff;
}

header{
  background:#172033;
  color:white;
  padding:18px 15px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:25px;
}

header p{
  margin:6px 0 0;
  font-size:14px;
  opacity:.8;
}

.chat{
  max-width:900px;
  margin:20px auto;
  padding:15px;
}

.status{
  background:#e8f7ed;
  color:#176b35;
  padding:10px;
  border-radius:12px;
  margin-bottom:15px;
  text-align:center;
}

.dark .status{
  background:#193524;
  color:#9df0b5;
}

.messages{
  min-height:300px;
  max-height:55vh;
  overflow-y:auto;
  padding:5px;
}

.msg{
  display:flex;
  margin:10px 0;
}

.msg.user{
  justify-content:flex-end;
}

.bubble{
  max-width:82%;
  padding:12px 15px;
  border-radius:16px;
  white-space:pre-wrap;
  line-height:1.45;
}

.assistant .bubble{
  background:white;
  box-shadow:0 2px 8px #0001;
}

.user .bubble{
  background:#172033;
  color:white;
}

.dark .assistant .bubble{
  background:#202a3d;
  color:white;
}

.quick,
.tools{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:12px 0;
}

button{
  border:0;
  border-radius:12px;
  padding:11px 14px;
  cursor:pointer;
  font-size:14px;
  background:#172033;
  color:white;
}

button:hover{
  opacity:.9;
}

.voice-on{
  background:#159447;
}

.voice-off{
  background:#b3261e;
}

.menu{
  display:none;
  background:white;
  border-radius:16px;
  padding:15px;
  margin:12px 0;
  box-shadow:0 4px 18px #0002;
}

.menu.show{
  display:block;
}

.dark .menu{
  background:#202a3d;
}

.menu h3{
  margin:8px 0;
}

.tool-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.tool-grid button{
  background:#27344d;
}

.input-area{
  display:flex;
  gap:8px;
  margin-top:15px;
}

textarea{
  flex:1;
  min-height:55px;
  resize:none;
  border:1px solid #ccd3df;
  border-radius:14px;
  padding:13px;
  font-size:16px;
  outline:none;
}

.dark textarea{
  background:#202a3d;
  color:white;
  border-color:#46536a;
}

.send{
  min-width:75px;
}

.footer{
  text-align:center;
  font-size:12px;
  opacity:.6;
  padding:20px;
}

@media(max-width:600px){
  .chat{
    margin:8px auto;
  }

  .bubble{
    max-width:90%;
  }

  .tool-grid{
    grid-template-columns:1fr 1fr;
  }

  .input-area{
    align-items:stretch;
  }

  .send{
    min-width:65px;
  }
}
</style>
</head>

<body>

<header>
  <h1>🤖 JARVIS AI</h1>
  <p>SRM Tools da Smart AI Assistant</p>
</header>

<div class="chat">

  <div id="status" class="status">
    ● JARVIS Ready
  </div>

  <div id="messages" class="messages">

    <div class="msg assistant">
      <div class="bubble">
Sat Sri Akal! 👋

Main JARVIS AI haan. 🤖

Tusi message likh ke jaan 🎤 Mic naal gall kar sakde ho.
      </div>
    </div>

  </div>

  <!-- QUICK ACTIONS -->
  <div class="quick">

    <button onclick="quickAsk('Mere SRM Tools website nu improve karan layi ideas deo.')">
      🌐 Website Ideas
    </button>

    <button onclick="quickAsk('Mere layi ik YouTube Shorts title bnao.')">
      ▶️ YouTube Title
    </button>

    <button onclick="quickAsk('Punjabi vich ik motivational caption likho.')">
      ✍️ Caption
    </button>

  </div>

  <!-- MAIN CONTROLS -->
  <div class="tools">

    <button onclick="startMic()">
      🎤 Mic
    </button>

    <button id="voiceBtn" class="voice-on" onclick="toggleVoice()">
      🔊 Voice ON
    </button>

    <button onclick="toggleMenu()">
      ⚙️ More Tools
    </button>

  </div>

  <!-- MORE TOOLS MENU -->
  <div id="toolMenu" class="menu">

    <h3>🛠️ SRM Tools</h3>

    <div class="tool-grid">

      <button onclick="toolMessage('Image Compressor')">
        🖼️ Image Compressor
      </button>

      <button onclick="toolMessage('Image Rotate')">
        🔄 Image Rotate
      </button>

      <button onclick="toolMessage('Image Flip')">
        ↔️ Image Flip
      </button>

      <button onclick="toolMessage('Image Size Checker')">
        📐 Image Size
      </button>

      <button onclick="toolMessage('Case Converter')">
        🔠 Case Converter
      </button>

      <button onclick="toolMessage('Word Counter')">
        🔢 Word Counter
      </button>

      <button onclick="toolMessage('Character Counter')">
        🔤 Character Counter
      </button>

      <button onclick="toolMessage('Text Cleaner')">
        🧹 Text Cleaner
      </button>

      <button onclick="toolMessage('Text Reverser')">
        🔁 Text Reverser
      </button>

      <button onclick="toolMessage('Percentage Calculator')">
        📊 Percentage
      </button>

      <button onclick="toolMessage('Age Calculator')">
        🎂 Age Calculator
      </button>

      <button onclick="toolMessage('Discount Calculator')">
        💰 Discount
      </button>

      <button onclick="toolMessage('Color Picker')">
        🎨 Color Picker
      </button>

      <button onclick="toolMessage('Password Generator')">
        🔐 Password
      </button>

      <button onclick="toolMessage('Random Number Generator')">
        🎲 Random Number
      </button>

      <button onclick="toolMessage('Stopwatch')">
        ⏱️ Stopwatch
      </button>

      <button onclick="toolMessage('Timer')">
        ⏰ Timer
      </button>

      <button onclick="toolMessage('Digital Clock')">
        🕐 Digital Clock
      </button>

      <button onclick="toolMessage('URL Encoder Decoder')">
        🔗 URL Encode
      </button>

      <button onclick="toolMessage('Text to PDF')">
        📄 Text to PDF
      </button>

    </div>

    <h3>🤖 AI Features</h3>

    <div class="tool-grid">

      <button onclick="aiPicture()">
        🖼️ AI Picture
      </button>

      <button onclick="aiVideo()">
        🎬 AI Video Editor
      </button>

    </div>

    <h3>⚙️ Settings</h3>

    <div class="tool-grid">

      <button onclick="toggleTheme()">
        🌙 Theme
      </button>

      <button onclick="clearChat()">
        🗑️ Clear Chat
      </button>

      <button onclick="stopSpeaking()">
        🔇 Stop Voice
      </button>

    </div>

  </div>

  <!-- INPUT -->
  <div class="input-area">

    <textarea
      id="message"
      placeholder="JARVIS nu message likho..."
    ></textarea>

    <button
      id="sendBtn"
      class="send"
      onclick="sendJarvis()"
    >
      Send
    </button>

  </div>

  <div class="footer">
    © 2026 SRM Tools • JARVIS AI 🤖
  </div>

</div>


<script>

const messageBox = document.getElementById("message");
const messages = document.getElementById("messages");
const sendBtn = document.getElementById("sendBtn");
const statusBox = document.getElementById("status");
const voiceBtn = document.getElementById("voiceBtn");
const toolMenu = document.getElementById("toolMenu");

let recognition = null;
let listening = false;

/* =========================
   VOICE OUTPUT
========================= */

let voiceEnabled =
  localStorage.getItem("jarvisVoice") !== "off";

function updateVoiceButton(){

  if(voiceEnabled){

    voiceBtn.textContent = "🔊 Voice ON";
    voiceBtn.className = "voice-on";

  }else{

    voiceBtn.textContent = "🔇 Voice OFF";
    voiceBtn.className = "voice-off";

  }

}

function toggleVoice(){

  voiceEnabled = !voiceEnabled;

  localStorage.setItem(
    "jarvisVoice",
    voiceEnabled ? "on" : "off"
  );

  if(!voiceEnabled){
    stopSpeaking();
  }

  updateVoiceButton();
}

function speak(text){

  if(!voiceEnabled) return;

  if(!("speechSynthesis" in window)) return;

  speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "pa-IN";
  speech.rate = 0.95;
  speech.pitch = 1;

  speechSynthesis.speak(speech);
}

function stopSpeaking(){

  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }

}


/* =========================
   MICROPHONE
========================= */

function startMic(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Tuhade browser vich voice input support nahi hai."
    );

    return;
  }

  if(listening){

    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();

  recognition.lang = "pa-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = function(){

    listening = true;
    statusBox.textContent = "🎤 Listening...";
  };

  recognition.onresult = function(event){

    const text =
      event.results[0][0].transcript;

    messageBox.value = text;

    sendJarvis();
  };

  recognition.onerror = function(){

    listening = false;
    statusBox.textContent = "● JARVIS Ready";
  };

  recognition.onend = function(){

    listening = false;
    statusBox.textContent = "● JARVIS Ready";
  };

  recognition.start();
}


/* =========================
   MENU
========================= */

function toggleMenu(){

  toolMenu.classList.toggle("show");

}


/* =========================
   CHAT
========================= */

function addMessage(text, who){

  const msg = document.createElement("div");

  msg.className =
    "msg " + who;

  const bubble =
    document.createElement("div");

  bubble.className = "bubble";

  bubble.textContent = text;

  msg.appendChild(bubble);

  messages.appendChild(msg);

  messages.scrollTop =
    messages.scrollHeight;

}

function quickAsk(text){

  messageBox.value = text;

  sendJarvis();

}


/* =========================
   JARVIS BACKEND
========================= */

async function sendJarvis(){

  const text =
    messageBox.value.trim();

  if(!text) return;

  addMessage(text, "user");

  messageBox.value = "";

  statusBox.textContent =
    "🤖 JARVIS Thinking...";

  sendBtn.disabled = true;

  addMessage(
    "JARVIS soch reha hai... 🤖",
    "assistant"
  );

  const typingBubble =
    messages.lastElementChild
      .querySelector(".bubble");

  try{

    const response =
      await fetch("/api/jarvis",{

        method:"POST",

        headers:{
          "Content-Type":
          "application/json"
        },

        body:JSON.stringify({
          message:text
        })

      });

    const data =
      await response.json();

    typingBubble.remove();

    if(!response.ok){

      throw new Error(
        data.error ||
        "Backend error"
      );

    }

    const reply =
      data.reply ||
      "JARVIS nu reply nahi milya.";

    addMessage(
      reply,
      "assistant"
    );

    speak(reply);

    statusBox.textContent =
      "● JARVIS Ready";

  }catch(error){

    typingBubble.textContent =
      "JARVIS AI backend response nahi de reha. 🤖";

    statusBox.textContent =
      "⚠️ Backend Error";

    console.error(error);

  }

  sendBtn.disabled = false;
}


/* =========================
   TOOL MESSAGE
========================= */

function toolMessage(name){

  addMessage(
    "🛠️ " + name +
    " select kita gaya.",
    "assistant"
  );

  statusBox.textContent =
    "🛠️ " + name;

}


/* =========================
   AI PICTURE
========================= */

function aiPicture(){

  addMessage(
    "🖼️ AI Picture\n\n" +
    "AI Picture feature da interface ready hai. " +
    "Actual image generation layi backend image API connect karni pavegi.",
    "assistant"
  );

  toolMenu.classList.remove("show");
}


/* =========================
   AI VIDEO
========================= */

function aiVideo(){

  addMessage(
    "🎬 AI Video Editor\n\n" +
    "AI Video Editor da option ready hai. " +
    "Actual AI video editing/generation layi backend/service connect karni pavegi.",
    "assistant"
  );

  toolMenu.classList.remove("show");
}


/* =========================
   THEME
========================= */

function toggleTheme(){

  document.body.classList.toggle("dark");

  localStorage.setItem(
    "jarvisTheme",
    document.body.classList.contains("dark")
      ? "dark"
      : "light"
  );

}


/* =========================
   CLEAR CHAT
========================= */

function clearChat(){

  stopSpeaking();

  messages.innerHTML = "";

  addMessage(
    "Sat Sri Akal! 👋\n\nMain JARVIS AI haan. 🤖",
    "assistant"
  );

  statusBox.textContent =
    "● JARVIS Ready";

}


/* =========================
   ENTER KEY
========================= */

messageBox.addEventListener(
  "keydown",
  function(event){

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendJarvis();

    }

  }
);


/* =========================
   LOAD SETTINGS
========================= */

if(
  localStorage.getItem("jarvisTheme")
  === "dark"
){

  document.body.classList.add("dark");

}

updateVoiceButton();

</script>

</body>
</html>
