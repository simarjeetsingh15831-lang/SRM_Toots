<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRM Tools</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f7fb;
  color:#172033;
  transition:.3s;
}

header{
  background:#172033;
  color:white;
  text-align:center;
  padding:35px 15px;
}

header h1{
  margin:0;
  font-size:34px;
}

header p{
  margin:10px 0 0;
  color:#cbd5e1;
}

.container{
  max-width:900px;
  margin:auto;
  padding:25px 15px;
}

.search{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:12px;
  font-size:16px;
  margin-bottom:25px;
}

.tools{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  text-align:center;
  transition:.2s;
}

.card:hover{
  transform:translateY(-4px);
}

.icon{
  font-size:42px;
}

.card h2{
  margin:10px 0;
}

.card p{
  color:#667085;
}

button{
  border:0;
  background:#172033;
  color:white;
  padding:11px 20px;
  border-radius:10px;
  cursor:pointer;
  font-size:15px;
}

.dark{
  background:#0f172a;
  color:white;
}

.dark .card{
  background:#1e293b;
}

.dark .card p{
  color:#cbd5e1;
}

.dark .search{
  background:#1e293b;
  color:white;
  border-color:#475569;
}

.toggle{
  position:absolute;
  right:15px;
  top:15px;
}

footer{
  text-align:center;
  padding:30px;
  color:#667085;
}
</style>
</head>

<body>

<button class="toggle" onclick="darkMode()">🌙</button>

<header>
  <h1>🛠️ SRM Tools</h1>
  <p>Simple • Fast • Free Tools</p>
</header>

<div class="container">

<input
  class="search"
  id="search"
  type="text"
  placeholder="🔍 Search tools..."
  onkeyup="searchTools()"
>

<div class="tools" id="tools">

<div class="card">
  <div class="icon">🖼️</div>
  <h2>Image Resize</h2>
  <p>Resize your images easily.</p>
  <button onclick="alert('Image Resize Tool Coming Soon!')">
    Open Tool
  </button>
</div>

<div class="card">
  <div class="icon">✂️</div>
  <h2>Image Crop</h2>
  <p>Crop your image quickly.</p>
  <button onclick="alert('Image Crop Tool Coming Soon!')">
    Open Tool
  </button>
</div>

<div class="card">
  <div class="icon">🔄</div>
  <h2>Image Converter</h2>
  <p>Convert images into different formats.</p>
  <button onclick="alert('Image Converter Coming Soon!')">
    Open Tool
  </button>
</div>

<div class="card">
  <div class="icon">📱</div>
  <h2>QR Generator</h2>
  <p>Create QR codes easily.</p>
  <button onclick="alert('QR Generator Coming Soon!')">
    Open Tool
  </button>
</div>

</div>
</div>

<footer>
  © 2026 SRM Tools
</footer>

<script>

function darkMode(){
  document.body.classList.toggle("dark");
}

function searchTools(){
  let input=document.getElementById("search").value.toLowerCase();
  let cards=document.querySelectorAll(".card");

  cards.forEach(card=>{
    let text=card.innerText.toLowerCase();

    if(text.includes(input)){
      card.style.display="";
    }else{
      card.style.display="none";
    }
  });
}

</script>

</body>
</html>
